# Example TLS-terminating reverse proxy in front of the web container (which itself proxies
# /api to the API, keeping cookies first-party). Not used by `docker compose` by default.
# Phase 3 adds a WebSocket location for multiplayer (/ws -> api:8000 with Upgrade headers).
server {
    listen 443 ssl http2;
    server_name world.example.com;          # replace
    ssl_certificate     /etc/ssl/ppw/fullchain.pem;
    ssl_certificate_key /etc/ssl/ppw/privkey.pem;

    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Immutable build assets and 3D models can be cached aggressively.
    location ~* ^/(_app/immutable|models)/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name world.example.com;
    return 301 https://$host$request_uri;
}
