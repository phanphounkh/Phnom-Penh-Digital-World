name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ppw
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ppw_test
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U ppw -d ppw_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ppw:ci-only-password@localhost:5440/ppw_test
      TEST_DATABASE_URL: postgresql+psycopg://ppw:ci-only-password@localhost:5440/ppw_test
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5174,http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
